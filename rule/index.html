<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayes’ Rule Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: tour + inputs in a left column; the question bar and five synchronized views on the right.
     Light theme only, by choice. Cell colors: hue = the truth (blue has it, orange doesn't),
     solid vs pale = the evidence (solid = evidence present). */
  --bg: #f2f3f0;
  --surface: #fdfdfb;
  --surface-2: #eceee9;
  --ink: #1c2024;
  --muted: #5a626a;
  --rule: #d5d9d3;
  --accent: #2f5d50;
  --on-accent: #ffffff;
  --he: #2a78d6;
  --hne: #bcd5f4;
  --nhe: #eb6834;
  --nhne: #f9ccb7;
  --e: #4b5259;
  --ne: #b4b9be;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-text: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
