<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayes’ Rule Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: tour + inputs in a left column; the question bar and five synchronized views on the right.
     Light theme only, by choice. Cell colors: hue = the truth (blue has it, orange doesn't),
     solid vs pale = the evidence (solid = evidence present). */
  --bg: #f2f3f0;
  --surface: #fdfdfb;
  --surface-2: #eceee9;
  --ink: #1c2024;
  --muted: #5a626a;
  --rule: #d5d9d3;
  --accent: #2f5d50;
  --on-accent: #ffffff;
  --he: #2a78d6;
  --hne: #bcd5f4;
  --nhe: #eb6834;
  --nhne: #f9ccb7;
  --e: #4b5259;
  --ne: #b4b9be;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-text: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { max-width: 1440px; margin: 0 auto; padding: 20px 24px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
header.top h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
header.top .byline { color: var(--muted); font-size: 0.95rem; }

.layout { max-width: 1440px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 24px); overflow-y: auto; padding-bottom: 4px; }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.card h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.lab { font-weight: 600; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.hint { color: var(--muted); font-size: 0.84rem; }

/* tour */
.tour { display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--accent); }
.tour-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tour h3 { margin: 0; font-size: 1.05rem; font-weight: 600; text-wrap: balance; }
.tour p { margin: 0; font-family: var(--font-text); font-size: 0.97rem; line-height: 1.58; }
.tour-nav { display: flex; align-items: center; gap: 8px; }
.dots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
.dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: var(--rule); cursor: pointer; }
.dots button[aria-current="step"] { background: var(--accent); }

/* controls */
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-weight: 500; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.seg.grid2 { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row; }
.seg.grid2 button + button { border-left: 0; }
.seg.grid2 button:nth-child(even) { border-left: 1px solid var(--rule); }
.seg.grid2 button:nth-child(n+3) { border-top: 1px solid var(--rule); }
.inputs { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.ctl { display: flex; flex-direction: column; gap: 2px; }
.ctl-head { display: flex; align-items: center; gap: 8px; }
.ctl-head label { flex: 1; font-weight: 500; font-size: 0.92rem; }
.ctl .aux { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.num { width: 70px; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); cursor: pointer; }
.btn { border: 1px solid var(--rule); background: var(--surface-2); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 0.9rem; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; }

/* question bar */
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; }
.ask .conds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.conds .seg { display: inline-flex; flex-wrap: wrap; }
.question { margin: 0; font-family: var(--font-text); font-size: 1.05rem; line-height: 1.5; max-width: 60ch; }
.answer-line { margin: 4px 0 0; color: var(--muted); font-size: 0.93rem; max-width: 70ch; }
.big { font-size: 2.3rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
.big small { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-top: 6px; }
.display-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-top: 10px; border-top: 1px solid var(--rule); }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }

/* views */
.views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.view { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.view.wide { grid-column: 1 / -1; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.view .read { margin: 0; color: var(--muted); font-size: 0.86rem; }
.view svg { width: 100%; height: auto; display: block; }
.view svg text { font-family: var(--font-ui); }
#icons-cv { width: 100%; height: 280px; display: block; }
#area { max-width: 380px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
.chips span { display: inline-flex; align-items: center; gap: 6px; transition: opacity 300ms; }
.chips .off { opacity: 0.35; text-decoration: line-through; }
.fade { transition: opacity 350ms; }

table.ct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.93rem; }
table.ct th, table.ct td { padding: 8px 10px; border: 1px solid var(--rule); text-align: right; transition: opacity 300ms, background-color 300ms; }
table.ct th { font-weight: 600; background: var(--surface-2); }
table.ct thead th:first-child { background: transparent; border-top-color: transparent; border-left-color: transparent; }
table.ct tbody th { text-align: left; }
table.ct td.cell { border-left-width: 5px; }
table.ct .dim { opacity: 0.28; }
table.ct .kept { background: #f4f6f1; }
table.ct .num-cell { outline: 2.5px solid var(--ink); outline-offset: -3px; font-weight: 600; }
table.ct .den { font-weight: 600; }
table.ct .share { display: block; font-size: 0.76rem; color: var(--muted); font-weight: 400; }

.formula { display: grid; grid-template-columns: 1fr; gap: 10px; }
.route { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: #fafbf8; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.route h3 { margin: 0; font-size: 0.86rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.route .eq { font-variant-numeric: tabular-nums; font-size: 0.95rem; line-height: 1.6; overflow-wrap: anywhere; }
.route .res { font-weight: 600; font-size: 1.15rem; }
.t-he { color: #1f62b4; font-weight: 600; }
.t-nhe { color: #b8461a; font-weight: 600; }
.t-hne { color: #3a6aa6; font-weight: 600; }
.t-nhne { color: #a35a3c; font-weight: 600; }
.formula-key { color: var(--muted); font-size: 0.84rem; margin: 0; }

.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; white-space: pre; font-variant-numeric: tabular-nums; display: none; z-index: 10; line-height: 1.35; }

@media (max-width: 1080px) {
  .views { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; padding: 0 14px 40px; }
  header.top { padding: 16px 14px 10px; }
  .side { position: static; max-height: none; overflow: visible; }
  .ask { grid-template-columns: 1fr; }
  .big { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .fade, .chips span, table.ct th, table.ct td { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Bayes’ Rule Visualizer</h1>
  <span class="byline">Sean Conte, PhD</span>
</header>

<main class="layout">
  <aside class="side">
    <section class="card tour" aria-label="Guided tour">
      <div class="tour-head"><span class="lab" id="tour-count">Step 1 of 10</span></div>
      <h3 id="tour-title"></h3>
      <p id="tour-text"></p>
      <div class="tour-nav">
        <div class="dots" id="tour-dots" aria-label="Tour steps"></div>
        <button type="button" class="btn" id="tour-back">Back</button>
        <button type="button" class="btn primary" id="tour-next">Next</button>
      </div>
    </section>

    <section class="card inputs" aria-label="Scenario and numbers">
      <div class="field">
        <span class="lab" id="lab-scen">Scenario</span>
        <div class="seg grid2" role="group" aria-labelledby="lab-scen" id="scen-seg"></div>
        <p class="hint" id="scen-blurb" style="margin:0"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><label for="r-ph" id="l-ph">Base rate</label><input class="num" type="number" id="v-ph" min="0" max="100" step="0.1" aria-label="Base rate in percent"></div>
        <input type="range" id="r-ph" min="0" max="100" step="0.1">
        <span class="aux" id="a-ph"></span>
      </div>
      <div class="ctl">
        <div class="ctl-head"><label for="r-hit" id="l-hit">Hit rate</label><input class="num" type="number" id="v-hit" min="0" max="100" step="0.1" aria-label="Hit rate in percent"></div>
        <input type="range" id="r-hit" min="0" max="100" step="0.1">
        <span class="aux" id="a-hit"></span>
      </div>
      <div class="ctl">
        <div class="ctl-head"><label for="r-fa" id="l-fa">False alarm rate</label><input class="num" type="number" id="v-fa" min="0" max="100" step="0.1" aria-label="False alarm rate in percent"></div>
        <input type="range" id="r-fa" min="0" max="100" step="0.1">
        <span class="aux" id="a-fa"></span>
      </div>
      <div class="field">
        <span class="lab" id="lab-n">Population for counting</span>
        <div class="row">
          <div class="seg" role="group" aria-labelledby="lab-n" id="n-seg">
            <button type="button" data-n="100">100</button>
            <button type="button" data-n="1000">1,000</button>
            <button type="button" data-n="10000">10,000</button>
          </div>
          <button type="button" class="btn" id="reset">Reset numbers</button>
        </div>
      </div>
    </section>
  </aside>

  <section class="main">
    <section class="card ask" aria-label="Question and answer">
      <div class="conds">
        <span class="lab" id="lab-cond">Condition on</span>
        <div class="seg" role="group" aria-labelledby="lab-cond" id="cond-seg"></div>
      </div>
      <div>
        <p class="question" id="question"></p>
        <p class="answer-line" id="answer-line"></p>
      </div>
      <div class="big" id="big" aria-live="polite"></div>
      <div class="display-row">
        <span class="lab" id="lab-units">Show numbers as</span>
        <div class="seg" role="group" aria-labelledby="lab-units" id="units-seg">
          <button type="button" data-units="freq">Frequencies</button>
          <button type="button" data-units="prob">Probabilities</button>
        </div>
        <span class="lab" id="lab-order">Split first by</span>
        <div class="seg" role="group" aria-labelledby="lab-order" id="order-seg">
          <button type="button" data-order="HE">The truth</button>
          <button type="button" data-order="EH">The evidence</button>
        </div>
        <div class="key" id="key"></div>
      </div>
    </section>

    <div class="views">
      <section class="card view" aria-labelledby="h-icons">
        <div class="view-head"><h2 id="h-icons">Count them</h2></div>
        <p class="read" id="read-icons"></p>
        <canvas id="icons-cv" role="img" aria-label="Icon array, one square per case, colored by group"></canvas>
        <div class="chips" id="icon-chips"></div>
      </section>

      <section class="card view" aria-labelledby="h-area">
        <div class="view-head">
          <h2 id="h-area">Compare areas</h2>
          <div class="seg" role="group" aria-label="Area shape" id="shape-seg">
            <button type="button" data-shape="square">Square</button>
            <button type="button" data-shape="pie">Pie</button>
          </div>
        </div>
        <p class="read" id="read-area"></p>
        <svg id="area" viewBox="0 0 300 300" role="img" aria-label="Area diagram of the four groups"></svg>
      </section>

      <section class="card view wide" aria-labelledby="h-tree">
        <div class="view-head"><h2 id="h-tree">Follow the branches</h2></div>
        <p class="read" id="read-tree"></p>
        <svg id="tree" viewBox="0 0 800 300" role="img" aria-label="Probability tree with branch widths proportional to probability"></svg>
      </section>

      <section class="card view" aria-labelledby="h-table">
        <div class="view-head"><h2 id="h-table">Read the table</h2></div>
        <p class="read" id="read-table"></p>
        <div style="overflow-x:auto"><table class="ct" id="ct"></table></div>
      </section>

      <section class="card view" aria-labelledby="h-formula">
        <div class="view-head"><h2 id="h-formula">Run the formula</h2></div>
        <p class="formula-key" id="formula-key"></p>
        <div class="formula" id="formula"></div>
      </section>
    </div>
  </section>
</main>
<div class="tip" id="tip"></div>

<script>
(() => {
  "use strict";

  // ---------------- Scenarios ----------------
  // All numbers are made up for illustration.
  const SCEN = {
    medical: {
      name: "Screening test", noun: "people", pH: 1, hit: 90, fa: 9,
      blurb: "A screening test for a condition that about 1 in 100 people have. It catches most real cases, but it sometimes flags people who are fine.",
      short: { H: "Has condition", nH: "No condition", E: "Positive", nE: "Negative" },
      rel: { H: "who have the condition", nH: "who don’t have it", E: "who test positive", nE: "who test negative" },
      pred: { H: ["has the condition", "have the condition"], E: ["tests positive", "test positive"] },
      sym: { H: "has the condition", E: "tests positive" },
      question: "Someone tests positive. How likely is it that they have the condition?"
    },
    smoke: {
      name: "Smoke alarm", noun: "evenings of cooking", pH: 2, hit: 95, fa: 10,
      blurb: "A kitchen smoke alarm. Real fires are rare, but burnt toast sets it off now and then.",
      short: { H: "Fire", nH: "No fire", E: "Alarm", nE: "Quiet" },
      rel: { H: "with a real fire", nH: "with no fire", E: "when the alarm goes off", nE: "when the alarm stays quiet" },
      pred: { H: ["has a real fire", "have a real fire"], E: ["sets off the alarm", "set off the alarm"] },
      sym: { H: "there is a real fire", E: "the alarm goes off" },
      question: "The alarm goes off. How likely is it that something is actually on fire?"
    },
    ai: {
      name: "AI-writing detector", noun: "essays", pH: 10, hit: 85, fa: 5,
      blurb: "A tool that flags essays as AI-written. It catches most AI essays, but it flags some student-written ones too.",
      short: { H: "AI-written", nH: "Student-written", E: "Flagged", nE: "Not flagged" },
      rel: { H: "written by AI", nH: "written by students", E: "that get flagged", nE: "that don’t get flagged" },
      pred: { H: ["was written by AI", "were written by AI"], E: ["gets flagged", "get flagged"] },
      sym: { H: "the essay was written by AI", E: "the essay gets flagged" },
      question: "An essay gets flagged. How likely is it that AI wrote it?"
    },
    rain: {
      name: "Morning clouds", noun: "days", pH: 20, hit: 80, fa: 30,
      blurb: "Rain isn’t rare here, and rainy afternoons usually start with a cloudy morning. Plenty of cloudy mornings clear up, though.",
      short: { H: "Rain", nH: "No rain", E: "Cloudy", nE: "Clear" },
      rel: { H: "with afternoon rain", nH: "without rain", E: "that start cloudy", nE: "that start clear" },
      pred: { H: ["gets afternoon rain", "get afternoon rain"], E: ["starts cloudy", "start cloudy"] },
      sym: { H: "it rains in the afternoon", E: "the morning is cloudy" },
      question: "The morning is cloudy. How likely is rain this afternoon?"
    }
  };
  const SCEN_KEYS = Object.keys(SCEN);

  const CELLS = ["HE", "HnE", "nHE", "nHnE"];
  const CELL_DIM = { HE: [1, 1], HnE: [1, 0], nHE: [0, 1], nHnE: [0, 0] };   // [has H, has E]
  const COND = {
    none: { keep: CELLS, num: [] },
    E:    { keep: ["HE", "nHE"],   num: ["HE"],  target: "H", given: "E",  dim: "e" },
    nE:   { keep: ["HnE", "nHnE"], num: ["HnE"], target: "H", given: "nE", dim: "e" },
    H:    { keep: ["HE", "HnE"],   num: ["HE"],  target: "E", given: "H",  dim: "h" },
    nH:   { keep: ["nHE", "nHnE"], num: ["nHE"], target: "E", given: "nH", dim: "h" }
  };

  const state = {
    scen: "medical", pH: 1, hit: 90, fa: 9, N: 1000,
    cond: "none", units: "freq", order: "HE", shape: "square", tour: 0
  };

  // ---------------- Model ----------------
  let M = null;
  function model() {
    const pH = state.pH / 100, hit = state.hit / 100, fa = state.fa / 100;
    const P = { HE: pH * hit, HnE: pH * (1 - hit), nHE: (1 - pH) * fa, nHnE: (1 - pH) * (1 - fa) };
    const N = state.N, nH = Math.round(N * pH), nnH = N - nH;
    const C = { HE: Math.round(nH * hit) };
    C.HnE = nH - C.HE; C.nHE = Math.round(nnH * fa); C.nHnE = nnH - C.nHE;
    return { pH, hit, fa, P, C, N };
  }
  const sum = (obj, keys) => keys.reduce((a, k) => a + obj[k], 0);

  // ---------------- Formatting ----------------
  const S = () => SCEN[state.scen];
  const fmtN = n => Math.round(n).toLocaleString("en-US");
  function fmtP(x) {
    if (!isFinite(x)) return "–";
    if (x === 0) return "0%";
    if (x === 1) return "100%";
    const v = x * 100;
    if (v < 0.01) return "<0.01%";
    if (v < 1) return v.toFixed(2) + "%";
    if (v > 99.9 && v < 100) return ">99.9%";
    return v.toFixed(1) + "%";
  }
  function fmtDec(x) {
    if (!isFinite(x)) return "–";
    if (x === 0) return "0";
    return String(parseFloat(x.toPrecision(3)));
  }
  function fmtNum(x) {
    if (!isFinite(x)) return "∞";
    if (x >= 100) return Math.round(x).toLocaleString("en-US");
    if (x >= 10) return (Math.round(x * 10) / 10).toString();
    return (Math.round(x * 100) / 100).toString();
  }
  const cellName = c => { const s = S().short, [h, e] = CELL_DIM[c]; return `${h ? s.H : s.nH} & ${e ? s.E : s.nE}`; };
  const evName = ev => S().short[ev];
  const COLORS = { HE: "#2a78d6", HnE: "#bcd5f4", nHE: "#eb6834", nHnE: "#f9ccb7" };
  const EDGE = { HE: "#2a78d6", HnE: "#7aa8e2", nHE: "#eb6834", nHnE: "#ef9b7a" };     // outline for pale cells
  const TEXT_ON = { HE: "#ffffff", HnE: "#1c2024", nHE: "#1c2024", nHnE: "#1c2024" };
  const L1COL = { H: "#2a78d6", nH: "#eb6834", E: "#4b5259", nE: "#b4b9be" };

  // value of a set of cells, in the current units
  function joint(cells) { return state.units === "freq" ? fmtN(sum(M.C, cells)) : fmtP(sum(M.P, cells)); }
  function share(numCells, denCells) {
    if (state.units === "freq") return `${fmtN(sum(M.C, numCells))} of ${fmtN(sum(M.C, denCells))}`;
    const d = sum(M.P, denCells);
    return d > 0 ? fmtP(sum(M.P, numCells) / d) : "–";
  }
  function plural(n, pair) { return Math.round(n) === 1 ? pair[0] : pair[1]; }

  // ---------------- Tooltip ----------------
  const tip = document.getElementById("tip");
  function showTip(e, text) {
    tip.textContent = text; tip.style.display = "block";
    const x = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  function cellTip(c) {
    const cond = COND[state.cond], kept = cond.keep.includes(c);
    let t = `${cellName(c)}\n${fmtN(M.C[c])} of ${fmtN(M.N)} ${S().noun} · ${fmtP(M.P[c])} of all`;

    const dimRowTot = r => state.cond !== "none" && cond.dim === "e" ? "dim" : (state.cond !== "none" && !keepRow(r) ? "dim" : "");
    const isDen = (where) => state.cond !== "none" && where === cond.given;
    const totCell = (cells, where, extraDim) => `<td class="${extraDim} ${isDen(where) ? "den kept" : ""}">${tot(cells)}${isDen(where) ? '<span class="share">the whole group</span>' : ""}</td>`;
    const colDim = col => state.cond !== "none" && (cond.dim === "h" || !keepCol(col)) ? "dim" : "";
    document.getElementById("ct").innerHTML = `
      <thead><tr><th></th><th>${sc.E}</th><th>${sc.nE}</th><th>Total</th></tr></thead>
      <tbody>
        <tr><th>${sc.H}</th>${td("HE")}${td("HnE")}${totCell(["HE", "HnE"], "H", dimRowTot("H"))}</tr>
        <tr><th>${sc.nH}</th>${td("nHE")}${td("nHnE")}${totCell(["nHE", "nHnE"], "nH", dimRowTot("nH"))}</tr>
        <tr><th>Total</th>${totCell(["HE", "nHE"], "E", colDim("E"))}${totCell(["HnE", "nHnE"], "nE", colDim("nE"))}<td class="${state.cond !== "none" ? "dim" : ""}">${state.units === "freq" ? fmtN(M.N) : "100%"}</td></tr>
      </tbody>`;
    const read = document.getElementById("read-table");
    if (state.cond === "none") read.textContent = "Every case lands in exactly one of the four inner cells. The totals add them up.";
    else read.textContent = `Conditioning keeps one ${cond.dim === "e" ? "column" : "row"}. The answer is the outlined cell divided by that ${cond.dim === "e" ? "column’s" : "row’s"} total.`;
  }

  // ---------------- View 5: formula ----------------
  function renderFormula() {
    const sc = S(), cond = COND[state.cond];
    document.getElementById("formula-key").innerHTML = `H means ${sc.sym.H}. E means ${sc.sym.E}. ¬ means “not.”`;
    const box = document.getElementById("formula");
    const pH = M.pH, hit = M.hit, fa = M.fa;
    const span = (cls, s) => `<span class="${cls}">${s}</span>`;
    if (state.cond === "none") {
      const pE = M.P.HE + M.P.nHE;
      box.innerHTML = route("Counts", `${span("t-he", fmtN(M.C.HE))} + ${span("t-nhe", fmtN(M.C.nHE))} = ${fmtN(M.C.HE + M.C.nHE)} of ${fmtN(M.N)} ${sc.noun} ${sc.rel.E}.`, `Before conditioning, nothing is ruled out.`)
        + route("Probabilities", `P(E) = ${span("t-he", "P(E | H) · P(H)")} + ${span("t-nhe", "P(E | ¬H) · P(¬H)")}<br>= ${span("t-he", `${fmtDec(hit)} × ${fmtDec(pH)}`)} + ${span("t-nhe", `${fmtDec(fa)} × ${fmtDec(1 - pH)}`)}<br>= ${fmtDec(pE)}`, `${fmtP(pE)} of all ${sc.noun}`)
        + route("Starting point", `P(H) = ${fmtDec(pH)}`, `${fmtP(pH)} before any evidence`);
      return;
    }
    const sym = { H: "H", nH: "¬H", E: "E", nE: "¬E" };
    if (cond.target === "E") {
      // conditioning on the truth: no Bayes needed; it's an input
      const isH = cond.given === "H";
      const p = isH ? hit : fa, numC = isH ? M.C.HE : M.C.nHE, denC = isH ? M.C.HE + M.C.HnE : M.C.nHE + M.C.nHnE;
      const flip = isH ? sum(M.P, ["HE"]) / sum(M.P, ["HE", "nHE"]) : sum(M.P, ["nHE"]) / sum(M.P, ["HE", "nHE"]);
      box.innerHTML = route("Counts", `${span(isH ? "t-he" : "t-nhe", fmtN(numC))} ÷ ${fmtN(denC)} = ${fmtP(numC / Math.max(1, denC))}`, ``)
        + route("Probabilities", `P(E | ${sym[cond.given]}) = ${fmtDec(p)}`, `No calculation needed: this is the ${isH ? "hit rate" : "false alarm rate"} you started with.`)
        + route("Don’t flip it by accident", `P(E | ${sym[cond.given]}) = ${fmtP(p)}<br>P(${sym[cond.given]} | E) = ${fmtP(flip)}`, `Same two events, opposite direction, different number.`);
      return;
    }
    // conditioning on the evidence: Bayes' rule
    const pos = cond.given === "E";
    const lh = pos ? hit : 1 - hit, ln = pos ? fa : 1 - fa;
    const a = lh * pH, b = ln * (1 - pH), post = a + b > 0 ? a / (a + b) : NaN;
    const cA = pos ? M.C.HE : M.C.HnE, cB = pos ? M.C.nHE : M.C.nHnE;
    const ev = sym[cond.given], clsA = pos ? "t-he" : "t-hne", clsB = pos ? "t-nhe" : "t-nhne";
    const countsHtml = `${span(clsA, fmtN(cA))} ÷ (${span(clsA, fmtN(cA))} + ${span(clsB, fmtN(cB))})<br>= ${fmtN(cA)} ÷ ${fmtN(cA + cB)}`;
    const probHtml = `P(H | ${ev}) = ${span(clsA, `P(${ev} | H) · P(H)`)} ÷ [${span(clsA, `P(${ev} | H) · P(H)`)} + ${span(clsB, `P(${ev} | ¬H) · P(¬H)`)}]`
      + `<br>= ${span(clsA, `${fmtDec(lh)} × ${fmtDec(pH)}`)} ÷ (${span(clsA, `${fmtDec(lh)} × ${fmtDec(pH)}`)} + ${span(clsB, `${fmtDec(ln)} × ${fmtDec(1 - pH)}`)})`
      + `<br>= ${fmtDec(a)} ÷ ${fmtDec(a + b)}`;
    let oddsHtml;
    if (pH <= 0 || pH >= 1 || ln <= 0) oddsHtml = `The odds form needs a base rate strictly between 0% and 100% and a nonzero ${pos ? "false alarm" : "correct-negative"} rate.`;
    else {
      const LR = lh / ln;
      let prior, postO;
      if (pH <= 0.5) { const k = (1 - pH) / pH; prior = `1 : ${fmtNum(k)}`; postO = `${fmtNum(LR)} : ${fmtNum(k)}`; }
      else { const k = pH / (1 - pH); prior = `${fmtNum(k)} : 1`; postO = `${fmtNum(k * LR)} : 1`; }
      oddsHtml = `Prior odds, H to ¬H: ${prior}<br>Likelihood ratio: ${span(clsA, fmtDec(lh))} ÷ ${span(clsB, fmtDec(ln))} = ${fmtNum(LR)}<br>Posterior odds: ${postO}`;
    }
    box.innerHTML = route("Counts", countsHtml, fmtP(cA / Math.max(1, cA + cB)))
      + route("Probabilities (Bayes’ rule)", probHtml, fmtP(post))
      + route("Odds", oddsHtml, isFinite(post) ? fmtP(post) : "");
  }
  function route(title, eq, res) {
    return `<div class="route"><h3>${title}</h3><div class="eq">${eq}</div>${res ? `<div class="res">${res}</div>` : ""}</div>`;
  }

  // ---------------- Inputs ----------------
  const scenSeg = document.getElementById("scen-seg");
  scenSeg.innerHTML = SCEN_KEYS.map(k => `<button type="button" data-scen="${k}">${SCEN[k].name}</button>`).join("");
  scenSeg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { setScenario(b.dataset.scen); render(true); }));
  function setScenario(k) {
    state.scen = k; const s = SCEN[k];
    state.pH = s.pH; state.hit = s.hit; state.fa = s.fa;
    buildCondButtons();
  }
  const sliders = [["ph", "pH"], ["hit", "hit"], ["fa", "fa"]].map(([id, key]) => {
    const r = document.getElementById("r-" + id), v = document.getElementById("v-" + id);
    r.addEventListener("input", () => { state[key] = Number(r.value); render(true, true); });
    v.addEventListener("change", () => { let x = Number(v.value); if (!isFinite(x)) x = state[key]; state[key] = Math.max(0, Math.min(100, x)); render(true, true); });
    return { r, v, key };
  });
  document.querySelectorAll("#n-seg button").forEach(b => b.addEventListener("click", () => { state.N = Number(b.dataset.n); render(true); }));
  document.getElementById("reset").addEventListener("click", () => { setScenario(state.scen); render(true); });
  document.querySelectorAll("#units-seg button").forEach(b => b.addEventListener("click", () => { state.units = b.dataset.units; render(); }));
  document.querySelectorAll("#order-seg button").forEach(b => b.addEventListener("click", () => { state.order = b.dataset.order; render(); }));
  document.querySelectorAll("#shape-seg button").forEach(b => b.addEventListener("click", () => { state.shape = b.dataset.shape; render(); }));

  function renderInputs() {
    const sc = S().short;
    scenSeg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scen === state.scen)));
    document.getElementById("scen-blurb").textContent = S().blurb + " All numbers are made up for illustration.";
    document.getElementById("l-ph").textContent = `Base rate: P(${sc.H})`;
    document.getElementById("l-hit").textContent = `Hit rate: P(${sc.E} | ${sc.H})`;
    document.getElementById("l-fa").textContent = `False alarm rate: P(${sc.E} | ${sc.nH})`;
    document.getElementById("a-ph").textContent = `${fmtN(M.C.HE + M.C.HnE)} of ${fmtN(M.N)} ${S().noun}`;
    document.getElementById("a-hit").textContent = `Misses ${fmtP(1 - M.hit)} of real cases`;
    document.getElementById("a-fa").textContent = `Correctly ${sc.nE.toLowerCase()} for ${fmtP(1 - M.fa)} of ${sc.nH.toLowerCase()} cases (specificity)`;
    for (const s of sliders) {
      if (Number(s.r.value) !== state[s.key]) s.r.value = state[s.key];
      if (document.activeElement !== s.v) s.v.value = String(state[s.key]);
    }
    document.querySelectorAll("#n-seg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.n) === state.N)));
    document.querySelectorAll("#units-seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.units === state.units)));
    document.querySelectorAll("#order-seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.order === state.order)));
    document.querySelectorAll("#shape-seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.shape === state.shape)));
  }

  // ---------------- Render ----------------
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  let lastLayoutKey = "";
  function render(modelChanged = false, fromSlider = false) {
    M = model();
    renderInputs();
    renderAsk();
    renderKey();
    // icons: rebuild when counts change; animate when only the view changes
    const countsKey = [M.N, M.C.HE, M.C.HnE, M.C.nHE, M.C.nHnE].join(",");
    const layoutKey = state.cond + state.order;
    if (!icons || countsKey !== icons.key) { buildIcons(); icons.key = countsKey; lastLayoutKey = layoutKey; }
    else if (layoutKey !== lastLayoutKey) { layoutIcons(true); lastLayoutKey = layoutKey; }
    renderIconText();
    renderTree();
    renderArea(!fromSlider);
    renderAreaText();
    renderTable();
    renderFormula();
    renderTour();
  }

  // ---------------- Tour ----------------
  const TOUR = [
    { title: "The question", apply: () => { setScenario("medical"); Object.assign(state, { cond: "none", units: "freq", order: "HE", shape: "square", N: 1000 }); },
      text: () => `${SCEN.medical.blurb} It catches ${fmtP(M.hit)} of real cases and wrongly flags ${fmtP(M.fa)} of people who don’t have it. Someone tests positive. How likely is it that they have the condition? Make a guess before you go on.` },
    { title: "Start with everyone", apply: () => { state.cond = "none"; },
      text: () => `Every view on the right shows the same ${fmtN(M.N)} ${S().noun}, just drawn differently. Nothing has been ruled out yet.` },
    { title: "Split by the truth", apply: () => { state.cond = "none"; state.order = "HE"; },
      text: () => `First split everyone by the truth: ${fmtN(M.C.HE + M.C.HnE)} of ${fmtN(M.N)} ${plural(M.C.HE + M.C.HnE, S().pred.H)}. See how thin that branch is in the tree, and how narrow its strip is in the square.` },
    { title: "Split by the evidence", apply: () => { state.cond = "none"; state.order = "HE"; },
      text: () => `Each group then splits by the test result. Of the ${fmtN(M.C.HE + M.C.HnE)} ${S().rel.H}, ${fmtN(M.C.HE)} ${plural(M.C.HE, S().pred.E)}. Of the ${fmtN(M.C.nHE + M.C.nHnE)} ${S().rel.nH}, ${fmtN(M.C.nHE)} ${plural(M.C.nHE, S().pred.E)} anyway. Those are the false alarms.` },
    { title: "Condition on the evidence", apply: () => { state.cond = "E"; state.order = "HE"; },
      text: () => `To condition is to keep only the cases that match what you learned. Set aside everyone who tested negative. The ${fmtN(M.C.HE + M.C.nHE)} ${S().noun} ${S().rel.E} are now the whole population.` },
    { title: "Same answer, every view", apply: () => { state.cond = "E"; },
      text: () => `Of those ${fmtN(M.C.HE + M.C.nHE)}, ${fmtN(M.C.HE)} ${plural(M.C.HE, S().pred.H)}: about ${fmtP(M.P.HE / (M.P.HE + M.P.nHE))}. Count the squares, follow the branches, compare the areas, read the table, or run the formula. Each one shows the same fraction: the outlined part over everything still in view.` },
    { title: "Flip the tree", apply: () => { state.cond = "E"; state.order = "EH"; },
      text: () => `Now split by the evidence first. The answer becomes a single branch of the tree, and the square’s columns are the two test results. Bayes’ rule is the step from the first tree to this one.` },
    { title: "Condition on something else", apply: () => { state.cond = "H"; state.order = "HE"; },
      text: () => `Condition on the truth instead: keep only the ${fmtN(M.C.HE + M.C.HnE)} ${S().noun} ${S().rel.H}. ${fmtN(M.C.HE)} of them ${plural(M.C.HE, S().pred.E)}, which is ${fmtP(M.hit)}, the hit rate we started with. That is a very different number from ${fmtP(M.P.HE / (M.P.HE + M.P.nHE))}.` },
    { title: "Frequencies or probabilities", apply: () => { state.cond = "E"; state.units = "prob"; state.order = "HE"; },
      text: () => `Switch to probabilities and only the labels change. ${fmtN(M.C.HE)} out of ${fmtN(M.C.HE + M.C.nHE)} becomes ${fmtDec(M.P.HE)} out of ${fmtDec(M.P.HE + M.P.nHE)}. Same fraction, same answer. The odds version gets there too.` },
    { title: "Move the base rate", apply: () => { state.cond = "E"; state.units = "freq"; },
      text: () => `Drag the base rate and watch every view respond together. When the condition is common, a positive test means much more. Then try the other scenarios, and try conditioning on each option.` }
  ];
  const dots = document.getElementById("tour-dots");
  dots.innerHTML = TOUR.map((t, i) => `<button type="button" aria-label="Step ${i + 1}: ${t.title}"></button>`).join("");
  dots.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => goTour(i)));
  document.getElementById("tour-back").addEventListener("click", () => goTour(Math.max(0, state.tour - 1)));
  document.getElementById("tour-next").addEventListener("click", () => goTour(Math.min(TOUR.length - 1, state.tour + 1)));
  function goTour(i) { state.tour = i; TOUR[i].apply(); render(true); }
  function renderTour() {
    const t = TOUR[state.tour];
    document.getElementById("tour-count").textContent = `Step ${state.tour + 1} of ${TOUR.length}`;
    document.getElementById("tour-title").textContent = t.title;
    document.getElementById("tour-text").textContent = t.text();
    dots.querySelectorAll("button").forEach((b, i) => { if (i === state.tour) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
    document.getElementById("tour-back").disabled = state.tour === 0;
    document.getElementById("tour-next").disabled = state.tour === TOUR.length - 1;
  }

  // ---------------- Start ----------------
  buildArea();
  TOUR[0].apply();
  M = model();
  sizeIcons();
  render(true);
})();
</script>
</body>
</html>
